[platformio]
default_envs =
  esp01_512k
  esp01_1m
  d1_mini
  nodemcuv2
  sonoff_basic_r2
  sonoff_basic_r3
  esp32dev
  esp32-c3
  esp32-s3
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
extra_scripts =
  pre:scripts/generate_web_ui.py
  scripts/esp8266_no_float.py
  pre:scripts/version.py
  post:scripts/merge_firmware.py
build_flags =
  -D SVB_CONFIG_SCHEMA=2
  -D SVB_ENABLE_TLS=1
  -D SVB_ENABLE_EXPERT=1
  -D SVB_ENABLE_OTA=1

[esp8266]
extends = common
platform = espressif8266@4.2.1
board_build.filesystem = littlefs
build_flags =
  ${common.build_flags}
  -D SVB_PLATFORM_ESP8266=1

[esp32]
extends = common
platform = espressif32@6.10.0
board_build.filesystem = littlefs
board_build.partitions = partitions/svitloboard_4mb.csv
build_flags =
  ${common.build_flags}
  -D SVB_PLATFORM_ESP32=1

; 512 KiB ESP-01 is a serial-install recovery profile. OTA and expert GPIO
; support are deliberately removed to keep enough space for TLS.
[env:esp01_512k]
extends = esp8266
board = esp01
board_build.ldscript = ld/eagle.flash.512k24.ld
build_unflags =
  -D SVB_ENABLE_OTA=1
  -D SVB_ENABLE_EXPERT=1
build_flags =
  ${esp8266.build_flags}
  -D SVB_BOARD_NAME=\"ESP-01-512K\"
  -D SVB_PROFILE_MINIMAL=1
  -D SVB_ENABLE_OTA=0
  -D SVB_ENABLE_EXPERT=0

[env:esp01_1m]
extends = esp8266
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
build_unflags =
  -D SVB_ENABLE_EXPERT=1
build_flags =
  ${esp8266.build_flags}
  -D SVB_BOARD_NAME=\"ESP-01S-1M\"
  -D SVB_ENABLE_EXPERT=0

[env:d1_mini]
extends = esp8266
board = d1_mini
build_flags =
  ${esp8266.build_flags}
  -D SVB_BOARD_NAME=\"D1-mini\"

[env:nodemcuv2]
extends = esp8266
board = nodemcuv2
build_flags =
  ${esp8266.build_flags}
  -D SVB_BOARD_NAME=\"NodeMCU-v2\"

; Sonoff Basic R2 uses an ESP8285 with 1 MiB integrated flash. This target is
; deliberately an indicator only: the onboard relay is never driven.
[env:sonoff_basic_r2]
extends = esp8266
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
build_flags =
  ${esp8266.build_flags}
  -D SVB_BOARD_NAME=\"Sonoff-Basic-R2\"
  -D SVB_RELAY_GPIO=12

; Kept as a separate release target so R2 and R3 hardware support can evolve
; independently even though both currently use ESP8285 and the same relay GPIO.
[env:sonoff_basic_r3]
extends = esp8266
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
build_flags =
  ${esp8266.build_flags}
  -D SVB_BOARD_NAME=\"Sonoff-Basic-R3\"
  -D SVB_RELAY_GPIO=12

[env:esp32dev]
extends = esp32
board = esp32dev
build_flags =
  ${esp32.build_flags}
  -D SVB_BOARD_NAME=\"ESP32-DevKit\"

[env:esp32-c3]
extends = esp32
board = esp32-c3-devkitm-1
build_flags =
  ${esp32.build_flags}
  -D SVB_BOARD_NAME=\"ESP32-C3-DevKitM-1\"

[env:esp32-s3]
extends = esp32
board = esp32-s3-devkitc-1
; The PlatformIO DevKitC-1 profile defaults to the N8 module and writes an
; 8 MiB size into the image header. Keep the release compatible with 4 MiB
; ESP32-S3 boards; the shared partition table already fits in 4 MiB.
board_upload.flash_size = 4MB
build_flags =
  ${esp32.build_flags}
  -D SVB_BOARD_NAME=\"ESP32-S3-DevKitC-1\"
